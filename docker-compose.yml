version: "3.8"

services:
  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/app/latam_gateway_challenge:cached
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    env_file: .env.development
    tty: true
    stdin_open: true

  db:
    image: postgres:12.1
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env.development

  redis:
    image: redis
    command: redis-server
    ports:
      - "6379:6379"
    depends_on:
      - 'db'

  sidekiq:
    build: .
    depends_on:
      - 'web'
      - 'db'
      - 'redis'
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec sidekiq"
    env_file: .env.development

volumes:
  postgres-data:
